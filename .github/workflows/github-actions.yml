on:
  push:
    branches:
      - '**'
    tags:
      - 'v**'

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm audit --audit-level=high

  build_api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - name: Sauvegarde du cache
        uses: actions/cache/save@v5
        with:
          path: |
            node_modules
            frontend/node_modules
          key: ${{ runner.os }}-node2-${{ hashFiles('**/package-lock.json') }}

  build_frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: cd frontend && npm ci && npm run build
      - name: Sauvegarde du cache
        uses: actions/cache/save@v5
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-frontend-${{ hashFiles('frontend/package-lock.json') }}

  lint-frontend:
    runs-on: ubuntu-latest
    needs: build_frontend
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/checkout@v6
      - name: Récupération du cache
        uses: actions/cache/restore@v5
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-frontend-${{ hashFiles('frontend/package-lock.json') }}
          fail-on-cache-miss: 'true'
      - run: cd frontend && npm run lint


  build-and-push-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set lowercase owner
        run: echo "OWNER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Build and Push Docker Image
        uses : docker/build-push-action@v6
        # run: |
        #   docker build --tag ghcr.io/${{ env.OWNER }}/next --target next ./
        #   docker push ghcr.io/${{ env.OWNER }}/next

  deploy-recette:
    runs-on: ubuntu-latest
    needs: [lint-frontend]
    if: github.ref == 'refs/heads/developp'
    steps:
      - name: Configuration de la clé SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AZURE_PEM }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.AZURE_IP }} >> ~/.ssh/known_hosts
      - name: Déploiement en recette
        run: |
          ssh ${{ secrets.AZURE_ID }}@${{ secrets.AZURE_IP }} << 'EOF'
            cd recette/CesiZenWebApp
            git fetch --all
            git checkout developp
            git pull origin developp
            docker compose -f compose.recette.yml up -d --pull always
          EOF

  deploy-prod:
    runs-on: ubuntu-latest
    needs: [lint-frontend]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Configuration de la clé SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AZURE_PEM }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.AZURE_IP }} >> ~/.ssh/known_hosts
      - name: Déploiement en production
        run: |
          ssh ${{ secrets.AZURE_ID }}@${{ secrets.AZURE_IP }} << 'EOF'
            cd production/CesiZenWebApp
            git fetch --all
            git checkout develop
            git pull origin develop
            docker compose -f compose.prod.yml up -d --pull always
          EOF